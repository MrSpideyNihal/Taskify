name: CI

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.11", "3.12" ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 libasound2-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,nlp,whisper]

      - name: Run Ruff Linter
        run: ruff check src/

      - name: Run Mypy Type Checker
        run: mypy src/

      - name: Run Safety Check
        run: safety check

      - name: Run Pytest with Coverage
        # GUI tests might require mock display on Ubuntu. Let's use xvfb on Ubuntu runner.
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get install -y xvfb
          xvfb-run --server-args="-screen 0 1024x768x24" pytest tests/unit/ -v --cov=src --cov-fail-under=80 --cov-report=xml

      - name: Run Pytest with Coverage (Windows)
        if: matrix.os == 'windows-latest'
        run: pytest tests/unit/ -v --cov=src --cov-fail-under=80 --cov-report=xml
