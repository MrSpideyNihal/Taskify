[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taskify"
version = "0.1.0"
description = "A fully offline, privacy-first, voice-driven personal task management application."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Nihal" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "vosk>=0.3.45",
    "httpx>=0.24.0",
    "click>=8.1.0",
    "customtkinter>=5.2.0",
]

[project.optional-dependencies]
nlp = [
    "spacy>=3.5.0",
]
whisper = [
    "faster-whisper>=0.10.0",
]
# Mobile target: installs only the core logic packages.
# Excludes desktop-only: sounddevice, soundfile, vosk, customtkinter, httpx.
# Intended for Chaquopy (Android) or Kivy-based targets where:
#   - STT is handled by the Vosk Android AAR (Java/Kotlin bridge)
#   - GUI is provided by Kivy or a native Android layout
#   - Audio capture uses the Android AudioRecord API
core_mobile = [
    "numpy>=1.24.0",
    "click>=8.1.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pyinstaller>=6.1.0",
    "safety>=2.3.0",
]

[project.scripts]
taskify = "taskify.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B"]
ignore = []

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "sounddevice.*",
    "soundfile.*",
    "vosk.*",
    "customtkinter.*",
    "spacy.*",
    "faster_whisper.*",
    "scipy.*",
]
ignore_missing_imports = true
